<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비디오 자막 생성기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <div id="header">
    <div class="header-left">
      <h1>비디오 자막 생성기</h1>
      <span id="app-version" class="version-badge" title="업데이트 이력 보기"></span>
    </div>
    <div class="header-actions">
      <button id="settings-toggle">설정</button>
    </div>
  </div>

  <!-- Changelog Modal -->
  <div id="changelog-overlay">
    <div id="changelog-modal">
      <div class="changelog-header">
        <span class="changelog-title">업데이트 이력</span>
        <button id="changelog-close">&times;</button>
      </div>
      <div id="changelog-content"></div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-panel">
    <label>
      음성 인식 엔진:
      <select id="engine-select">
        <option value="faster-whisper" selected>faster-whisper (CTranslate2, 최고 성능)</option>
        <option value="openai-whisper">openai-whisper (PyTorch, 원본)</option>
        <option value="crisperwhisper">CrisperWhisper 2.0 (정밀 타임스탬프)</option>
      </select>
    </label>
    <label>
      모델:
      <!-- 옵션은 app.js의 ENGINE_MODELS로 엔진별 구성됨 -->
      <select id="model-select"></select>
    </label>
    <label id="cw-mode-label" style="display:none;">
      전사 모드:
      <select id="cw-mode-select">
        <option value="intended" selected>정제 (읽기 좋은 자막)</option>
        <option value="verbatim">축어 (말한 그대로, 필러 포함)</option>
      </select>
    </label>
    <label>
      처리 장치:
      <select id="device-select">
        <option value="auto" selected>자동 (GPU 우선)</option>
        <option value="cuda">GPU (CUDA)</option>
        <option value="cpu">CPU</option>
      </select>
    </label>
    <label>
      음성 언어:
      <select id="language-select">
        <option value="ko" selected>한국어</option>
        <option value="en">영어</option>
        <option value="ja">일본어</option>
        <option value="zh">중국어</option>
        <option value="auto">자동 감지</option>
      </select>
    </label>
    <label>
      번역 (한국어가 아닐 때):
      <select id="translate-select">
        <option value="ko" selected>한국어로 번역</option>
        <option value="both">원문 + 한국어</option>
        <option value="off">사용 안 함</option>
      </select>
    </label>
  </div>

  <!-- Main Layout -->
  <div id="main-layout">
    <!-- Queue Panel (Left Sidebar) -->
    <div id="queue-panel">
      <div class="queue-header">
        <span class="queue-title">작업 목록 <span id="queue-count">(0)</span></span>
        <div class="queue-actions">
          <button id="queue-add-btn" title="파일 추가">+ 추가</button>
          <button id="queue-clear-btn" title="목록 비우기">비우기</button>
        </div>
      </div>
      <div id="queue-list"></div>
      <div class="queue-footer">
        <button id="queue-start-btn" disabled>전체 시작</button>
        <button id="queue-stop-btn" disabled>중지</button>
      </div>
    </div>

    <!-- Content Area -->
    <div id="content">
      <!-- Dependency Warning / Engine Install -->
      <div id="dep-warning">
        <div class="title">음성 인식 엔진 설치</div>
        <div class="dep-list" id="dep-list"></div>
        <div class="message" id="engine-message">
          음성 인식 엔진(약 3GB 다운로드)이 설치되어 있지 않습니다.<br>
          최초 1회만 설치하면 이후 앱 업데이트는 자동으로 빠르게 진행됩니다.
        </div>
        <div class="engine-progress" id="engine-progress-wrap" style="display:none; width:80%; max-width:420px; margin:12px auto;">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="engine-progress-fill"></div>
          </div>
          <div class="progress-message" id="engine-progress-message"></div>
        </div>
        <button id="engine-install-btn">엔진 다운로드 및 설치</button>
      </div>

      <!-- Drop Zone -->
      <div id="drop-zone">
        <div class="icon">🎬</div>
        <div class="title">비디오 파일을 여기에 놓으세요</div>
        <div class="subtitle">MP4, MKV, AVI, MOV, WebM 지원 | 여러 파일을 한 번에 추가 가능</div>
      </div>

      <!-- Processing View -->
      <div id="processing-view">
        <div class="file-info">
          <div class="filename" id="proc-filename"></div>
          <div class="filesize" id="proc-filesize"></div>
          <div class="queue-progress-label" id="proc-queue-label"></div>
        </div>

        <div class="progress-steps">
          <div class="step" data-stage="extracting">
            <div class="dot">1</div>
            <div class="label">오디오<br>추출</div>
          </div>
          <div class="step" data-stage="transcribing">
            <div class="dot">2</div>
            <div class="label">음성<br>인식</div>
          </div>
          <div class="step" data-stage="generating">
            <div class="dot">3</div>
            <div class="label">자막<br>생성</div>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="progress-message" id="progress-message"></div>
        </div>

        <button id="cancel-btn">현재 작업 취소</button>
      </div>

      <!-- Result View -->
      <div id="result-view">
        <div class="result-header">
          <div class="result-stats">
            <div class="stat">파일: <span id="res-filename"></span></div>
            <div class="stat">언어: <span id="res-lang"></span></div>
            <div class="stat">구간: <span id="res-segments"></span></div>
            <div class="stat">길이: <span id="res-duration"></span></div>
            <div class="stat">처리: <span id="res-device"></span></div>
          </div>
          <div class="result-actions">
            <button id="save-as-btn">다른 이름으로 저장</button>
            <button id="new-video-btn">새 작업</button>
          </div>
        </div>
        <div id="srt-preview"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
