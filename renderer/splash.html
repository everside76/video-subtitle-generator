<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }
    .icon { font-size: 48px; margin-bottom: 18px; }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 12px; color: #6b7fa3; margin-bottom: 28px; }
    .progress-track {
      width: 240px;
      height: 4px;
      background: #0f3460;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #2196f3, #21cbf3);
      border-radius: 2px;
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 40%; margin-left: 30%; }
      100% { width: 0%; margin-left: 100%; }
    }
    .status { font-size: 11px; color: #6b7fa3; }
  </style>
</head>
<body>
  <div class="icon">🎬</div>
  <div class="title">비디오 자막 생성기</div>
  <div class="subtitle">Video Subtitle Generator</div>
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
  <div class="status">로딩 중...</div>
</body>
</html>
